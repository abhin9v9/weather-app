version: '3.8'

services:
  # MongoDB for local development
  mongodb:
    image: mongo:7
    container_name: weather-dashboard-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: weather-dashboard
    networks:
      - weather-network
    restart: unless-stopped

  # MongoDB Express - Web-based MongoDB admin interface (optional)
  mongo-express:
    image: mongo-express:latest
    container_name: weather-dashboard-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - weather-network
    restart: unless-stopped

  # Redis for caching (optional, for production)
  redis:
    image: redis:7-alpine
    container_name: weather-dashboard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - weather-network
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  weather-network:
    driver: bridge
